<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <main class="w-full max-w-md p-6 bg-white rounded shadow">
      <h1 class="text-2xl font-semibold mb-4">Entrar</h1>

      <form id="signin-form" class="space-y-4" aria-label="Formulário de login">
        <div>
          <label for="signin-email" class="block text-sm font-medium text-gray-700">Email</label>
          <input id="signin-email" name="email" type="email" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
          <label for="signin-password" class="block text-sm font-medium text-gray-700">Senha</label>
          <input id="signin-password" name="password" type="password" required minlength="6" class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex items-center justify-between">
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Entrar</button>
          <div class="space-x-2">
            <a href="signup.html" class="text-sm text-blue-600 hover:underline">Criar conta</a>
            <a href="forgot.html" class="text-sm text-blue-600 hover:underline">Esqueci a senha</a>
          </div>
        </div>

        <div id="signin-error" role="alert" class="text-sm text-red-600"></div>
      </form>

      <div class="my-6 flex items-center gap-3">
        <hr class="flex-1 border-gray-200" />
        <span class="text-xs text-gray-400 uppercase tracking-wide">ou continue com</span>
        <hr class="flex-1 border-gray-200" />
      </div>

      <div class="space-y-3">
        <button id="oauth-btn-google" type="button"
          class="w-full flex items-center justify-center gap-3 px-4 py-2 border border-gray-300 rounded bg-white hover:bg-gray-50 text-sm font-medium text-gray-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.16 2.86l6.1-6.1C34.46 3.19 29.53 1 24 1 14.82 1 7.07 6.54 3.65 14.34l7.1 5.52C12.5 13.81 17.8 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.43-4.75H24v9h12.7c-.55 2.97-2.2 5.48-4.7 7.17l7.3 5.67C43.48 37.42 46.5 31.4 46.5 24.5z"/>
            <path fill="#FBBC05" d="M10.75 28.14A14.6 14.6 0 0 1 9.5 24c0-1.44.25-2.84.7-4.14l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.87.93 7.53 2.57 10.76l8.18-6.62z"/>
            <path fill="#34A853" d="M24 47c5.53 0 10.17-1.83 13.56-4.97l-7.3-5.67c-1.84 1.24-4.19 1.97-6.26 1.97-6.2 0-11.5-4.31-13.25-10.19l-8.18 6.62C7.07 41.46 14.82 47 24 47z"/>
          </svg>
          Entrar com Google
        </button>

        <button id="oauth-btn-apple" type="button"
          class="w-full flex items-center justify-center gap-3 px-4 py-2 border border-gray-300 rounded bg-black hover:bg-gray-900 text-sm font-medium text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.55-1.32 3.08-2.53 3.99zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          Entrar com Apple
        </button>
      </div>

      <hr class="my-6" />

      <p class="text-sm text-gray-600">As credenciais do Supabase foram pré-configuradas para testes locais.</p>

    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
