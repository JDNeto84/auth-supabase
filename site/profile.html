<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <main class="w-full max-w-2xl p-6 bg-white rounded shadow">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold">Perfil</h1>
        <button id="signout-btn" class="px-3 py-2 bg-red-600 text-white rounded">Sair</button>
      </div>

      <section id="profile-section" class="space-y-4">
        <div class="flex items-center gap-4 p-4 bg-gray-50 rounded">
          <img id="user-avatar" src="" alt="" class="w-14 h-14 rounded-full object-cover hidden" />
          <div>
            <p id="user-name" class="font-medium text-gray-900"></p>
            <p id="user-email" class="text-sm text-gray-500"></p>
            <p id="user-provider" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
        </div>

        <div class="p-4 bg-gray-50 rounded">
          <h2 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-3">Metadados</h2>
          <dl id="user-meta" class="divide-y divide-gray-100"></dl>
        </div>

        <div class="p-4 bg-gray-50 rounded">
          <p class="text-xs text-gray-400">ID: <span id="user-id" class="font-mono"></span></p>
        </div>
      </section>

      <div id="profile-error" class="text-sm text-red-600 mt-4"></div>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
