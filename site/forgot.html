<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Esqueci a senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <main class="w-full max-w-md p-6 bg-white rounded shadow">
      <h1 class="text-2xl font-semibold mb-4">Esqueci a senha</h1>

      <p class="text-sm text-gray-700 mb-4">Digite seu email e enviaremos um link de redefinição de senha.</p>

      <form id="forgot-form" class="space-y-4" aria-label="Formulário de senha perdida">
        <div>
          <label for="forgot-email" class="block text-sm font-medium text-gray-700">Email</label>
          <input id="forgot-email" name="email" type="email" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex items-center justify-between">
          <button type="submit" class="px-4 py-2 bg-orange-600 text-white rounded hover:bg-orange-700">Enviar link</button>
          <a href="index.html" class="text-sm text-blue-600 hover:underline">Voltar ao login</a>
        </div>

        <div id="forgot-error" role="alert" class="text-sm text-red-600"></div>
        <div id="forgot-success" role="status" class="text-sm text-green-600"></div>
      </form>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
