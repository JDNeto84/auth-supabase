<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redefinir senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <main class="w-full max-w-md p-6 bg-white rounded shadow">
      <h1 class="text-2xl font-semibold mb-4">Redefinir senha</h1>
      <p class="text-sm text-gray-700 mb-4">Use o formulário abaixo para definir uma nova senha.</p>
      <form id="reset-form" class="space-y-4" aria-label="Formulário de redefinir senha">
        <div>
          <label for="reset-password" class="block text-sm font-medium text-gray-700">Nova senha</label>
          <input id="reset-password" name="password" type="password" required minlength="6" class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
          <label for="reset-confirm-password" class="block text-sm font-medium text-gray-700">Confirmar senha</label>
          <input id="reset-confirm-password" name="confirmPassword" type="password" required minlength="6" class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div class="flex justify-between items-center">
          <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Atualizar senha</button>
          <a href="index.html" class="text-sm text-blue-600 hover:underline">Voltar</a>
        </div>
        <div id="reset-error" role="alert" class="text-sm text-red-600"></div>
        <div id="reset-success" role="status" class="text-sm text-green-600"></div>
      </form>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
